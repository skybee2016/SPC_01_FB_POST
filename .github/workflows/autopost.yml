name: Senior Peace Care autopost

on:
  schedule:
    # 3 posts/day, every 8 hours: 00:00, 08:00, 16:00 UTC (05:30, 13:30, 21:30 IST)
    - cron: "0 0,8,16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  autopost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate and publish one post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python scripts/run_autopost.py

      - name: Save post archive to repo
        run: |
          git config user.name "spc-autopost-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posts/
          git diff --cached --quiet || git commit -m "autopost: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
